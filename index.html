<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060c16">
<title>UNKNOWN SCRIPT</title>
<style>:root{
  --bg:#050a14; --bg2:#08111f; --panel:#0b1626; --panel2:#0f1d31; --line:#1a2e47; --line2:#24405f;
  --ink:#d5e6ee; --dim:#7f97ab; --faint:#4d6479;
  --teal:#38dcc3; --cyan:#8eeeff; --amber:#f0c36b; --red:#ff7a85; --green:#6fe39a;
  --glyph:#c4e8f0; --solved:#4fe3c1; --unit:#8ef0b8;
  --gh:34px; --zoom:1; --glow:6px; --ui:1;
  --r:10px;
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:calc(15px * var(--ui))}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(1200px 600px at 70% -10%,rgba(56,220,195,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(80,140,255,.06),transparent 60%);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;min-height:100vh}
/* header */
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:8px 14px;background:rgba(5,10,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;letter-spacing:.32em;font-size:.95rem;color:var(--cyan);text-shadow:0 0 12px rgba(142,238,255,.45)}
.brand small{display:block;font-size:.62rem;letter-spacing:.12em;color:var(--dim)}
.logo{width:26px;height:26px;border:1.5px solid var(--teal);border-radius:50%;position:relative;box-shadow:0 0 12px rgba(56,220,195,.4) inset,0 0 10px rgba(56,220,195,.25)}
.logo:after{content:"";position:absolute;left:5px;right:5px;top:11px;height:1.5px;background:var(--teal);box-shadow:0 -5px 0 -0.2px var(--teal)}
#nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
#nav button{background:transparent;border:1px solid transparent;color:var(--dim);padding:7px 11px;border-radius:8px;font-size:.85rem;display:flex;gap:6px;align-items:center}
#nav button i{font-style:normal;font-size:.7rem;color:var(--faint)}
#nav button:hover{color:var(--ink);border-color:var(--line)}
#nav button.on{color:var(--cyan);border-color:var(--line2);background:linear-gradient(180deg,rgba(56,220,195,.12),rgba(56,220,195,.02));box-shadow:0 0 14px rgba(56,220,195,.12) inset}
#savestat{font-size:.7rem;color:var(--faint);white-space:nowrap}
#savestat.err{color:var(--red)}
main{flex:1;min-height:0;padding:14px;max-width:1500px;width:100%;margin:0 auto}
/* generic */
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r)}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:.85rem;line-height:1.2}
.btn:hover{border-color:var(--teal);color:var(--cyan)}
.btn.pri{background:linear-gradient(180deg,rgba(56,220,195,.25),rgba(56,220,195,.08));border-color:var(--teal);color:var(--cyan)}
.btn.warn{border-color:#6a3b44;color:var(--red)}
.btn.sm{padding:4px 8px;font-size:.78rem}
.btn.on{border-color:var(--teal);color:var(--cyan);background:rgba(56,220,195,.14)}
.btn:disabled{opacity:.4;cursor:default}
.ib{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;font-size:1rem}
input[type=text],input[type=search],input:not([type]),textarea,select{background:#060e1b;border:1px solid var(--line2);border-radius:7px;padding:7px 9px;color:var(--ink);outline:none;width:100%}
textarea{resize:vertical;min-height:2.4em;line-height:1.45}
input:focus,textarea:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 2px rgba(56,220,195,.15)}
label.f{display:block;font-size:.72rem;color:var(--dim);margin:8px 0 3px;letter-spacing:.05em}
.muted{color:var(--dim)}.faint{color:var(--faint)}
.chip{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.chip.s0{color:var(--faint)}.chip.s1{color:var(--amber);border-color:#5d4b2a}.chip.s2{color:var(--cyan);border-color:#2b5866}.chip.s3{color:var(--green);border-color:#2d5a3e}
.chip.ok{color:var(--green);border-color:#2d5a3e}.chip.ng{color:var(--red);border-color:#5a2d33}.chip.wip{color:var(--amber);border-color:#5d4b2a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
h2.vt{margin:0 0 10px;font-size:1rem;letter-spacing:.2em;color:var(--cyan);font-weight:600}
h3{font-size:.9rem;margin:14px 0 8px;color:var(--ink);letter-spacing:.05em}
.sec-t{font-size:.7rem;letter-spacing:.2em;color:var(--teal);text-transform:uppercase;margin:0 0 6px}
.empty{padding:22px;text-align:center;color:var(--faint);font-size:.85rem}
.scroll{overflow:auto}

/* glyphs */
.gc{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;vertical-align:top;position:relative;color:var(--glyph);border-radius:4px;-webkit-tap-highlight-color:transparent;transition:color .15s,background .15s}
.gs{display:block;width:calc(var(--gh) * .75 * var(--zoom) * var(--k,1));height:calc(var(--gh) * var(--zoom) * var(--k,1));stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;overflow:visible;filter:drop-shadow(0 0 calc(var(--glow) * .5) rgba(142,238,255,calc(.12 + var(--glow) / 40px * 1)))}
.gs.gm{width:calc(var(--gh) * .5 * var(--zoom) * var(--k,1))}
.dt{stroke-width:2.9}
.gc:hover{color:#fff;background:rgba(142,238,255,.06)}
.gc.sv{color:var(--solved)}
.ln.su .gc{color:var(--unit)}
.ln.su .gc.sv{color:var(--solved)}
.gc.hl{color:#fff;background:rgba(56,220,195,.13);box-shadow:0 0 0 1px rgba(56,220,195,.25)}
.gc.cur{background:rgba(240,195,107,.18);box-shadow:0 0 0 1.5px var(--amber);color:#fff}
.gc.seq{background:rgba(142,160,255,.22);box-shadow:0 0 0 1.5px #8ea0ff;color:#fff}
.gc.flash{animation:flash 1.4s ease-out 2}
@keyframes flash{0%{background:rgba(240,195,107,.6);box-shadow:0 0 18px var(--amber)}100%{background:transparent}}
.w{display:inline-flex;align-items:flex-start;margin-right:calc(var(--gh) * .4 * var(--zoom) * var(--k,1))}
.ln{display:inline-flex;flex-wrap:wrap;row-gap:4px;align-items:flex-start}
.mm{width:calc(var(--gh) * .75 * var(--zoom) * var(--k,1));min-height:10px;font-size:calc(10px * var(--zoom));line-height:1.15;text-align:center;word-break:break-all;overflow-wrap:anywhere;padding-top:1px}
.gm + .mm{width:calc(var(--gh) * .5 * var(--zoom) * var(--k,1))}
.mm i{display:block;font-style:normal}
.mm .c{color:#86e8d4}.mm .l{color:var(--amber)}
.mm .x{color:var(--cyan);background:rgba(56,220,195,.12);border-radius:3px}
.mm .y{color:var(--faint)}
.nomemo .mm{display:none}
.mini{--gh:22px;--k:1;--zoom:1}
.mini .gc{cursor:pointer}
.mini .w{margin-right:7px}
.gbig{--gh:62px;--zoom:1;--k:1;display:inline-block}
.gbig .gs{filter:drop-shadow(0 0 8px rgba(142,238,255,.5))}

/* reader */
.reader{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.reader.noinsp{grid-template-columns:minmax(0,1fr)}
.reader.noinsp .insp{display:none}
.rbar{position:sticky;top:58px;z-index:20;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;margin-bottom:10px;background:rgba(8,17,31,.94);backdrop-filter:blur(6px)}
.pageid{font-size:.8rem;color:var(--dim);min-width:92px;text-align:center}
.pageid b{color:var(--cyan);font-size:1rem}
.ticks{display:flex;gap:2px;flex-wrap:wrap;max-width:300px}
.ticks span{width:9px;height:14px;border-radius:2px;background:#13243a;cursor:pointer;border:1px solid transparent}
.ticks span.r{background:#1d3f52}
.ticks span.c{background:var(--teal);box-shadow:0 0 8px var(--teal)}
.paper{position:relative;padding:28px 30px 64px;min-height:70vh;overflow:hidden;
  background:linear-gradient(180deg,rgba(14,32,52,.92),rgba(7,15,27,.96)),repeating-linear-gradient(0deg,transparent 0 31px,rgba(56,220,195,.03) 31px 32px);
  border:1px solid var(--line2);border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.5) inset,0 20px 60px rgba(0,0,0,.4)}
.paper:before{content:"";position:absolute;inset:8px;border:1px solid rgba(56,220,195,.08);border-radius:8px;pointer-events:none}
.paper .corner{position:absolute;width:18px;height:18px;border-color:rgba(56,220,195,.35);border-style:solid;pointer-events:none}
.paper .c1{top:6px;left:6px;border-width:1.5px 0 0 1.5px}.paper .c2{top:6px;right:6px;border-width:1.5px 1.5px 0 0}
.paper .c3{bottom:6px;left:6px;border-width:0 0 1.5px 1.5px}.paper .c4{bottom:6px;right:6px;border-width:0 1.5px 1.5px 0}
.it{margin:0 0 calc(14px * var(--zoom))}
.it.h{text-align:center;padding-bottom:10px;margin-bottom:20px;border-bottom:1px solid rgba(56,220,195,.18)}
.it.h .ln{justify-content:center;--k:1.3}
.it.h .ln .gs{filter:drop-shadow(0 0 10px rgba(142,238,255,.45))}
.it.d{display:flex;gap:10px;align-items:flex-start}
.it.d .spk{color:var(--faint);font-size:.7rem;padding-top:calc(var(--gh) * .35 * var(--zoom))}
.it.d:nth-child(even){padding-left:28px}
.it.li{display:flex;gap:10px;align-items:flex-start}
.it.li .bul{width:8px;height:8px;border:1.5px solid var(--teal);transform:rotate(45deg);margin-top:calc(var(--gh) * .45 * var(--zoom));flex:none}
.it.n{border-left:2px solid rgba(240,195,107,.35);padding-left:12px;--k:.8;opacity:.92}
.pnum{position:absolute;left:22px;bottom:14px;--k:.8}
.tblw{overflow-x:auto;margin:0 0 18px}
table.dt{border-collapse:collapse;margin:0 auto}
table.dt td,table.dt th{border:1px solid rgba(56,220,195,.18);padding:4px 10px;vertical-align:top}
table.dt th{background:rgba(56,220,195,.06)}
table.dt .ln{--k:.85}
.fig{position:relative;margin:4px auto 22px;max-width:620px;border:1px solid rgba(56,220,195,.15);border-radius:10px;background:rgba(3,8,16,.5)}
.fig svg.art{display:block;width:100%;height:auto}
.fig .lbl{position:absolute;transform:translate(-50%,-50%);--k:.72;background:rgba(5,12,22,.72);padding:2px 5px;border-radius:6px;border:1px solid rgba(56,220,195,.18)}
.fig .lbl .ln{flex-wrap:nowrap}
.fig .lbl .w{margin-right:6px}
.fig .lbl .w:last-child{margin-right:0}
.seqbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;margin-bottom:10px;border:1px dashed #5d6bbf;border-radius:8px;background:rgba(142,160,255,.06)}
.seqbar .mini{--gh:26px}

/* inspector */
.insp{position:sticky;top:58px;max-height:calc(100vh - 72px);display:flex;flex-direction:column;overflow:hidden}
.insp .ih{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.insp .tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:none;color:var(--dim);padding:7px 9px;font-size:.78rem;border-bottom:2px solid transparent}
.tabs button.on{color:var(--cyan);border-bottom-color:var(--teal)}
.insp .ib2{padding:10px 12px;overflow:auto;flex:1;font-size:.82rem}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.stat div{background:#071120;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.stat b{display:block;font-size:1.15rem;color:var(--cyan)}
.stat small{color:var(--dim);font-size:.66rem}
.plist{list-style:none;margin:0;padding:0}
.plist li{border-bottom:1px solid var(--line);padding:6px 2px}
.plist .ph{display:flex;align-items:center;gap:8px;cursor:pointer}
.bar{height:6px;background:#0f2036;border-radius:9px;flex:1;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan))}
.kwic{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 6px;align-items:center;padding:4px 2px;border-bottom:1px solid rgba(26,46,71,.6);cursor:pointer}
.kwic:hover{background:rgba(142,238,255,.04)}
.kwic .L{justify-self:end}
.kwic .K .gc{color:var(--amber)}
.kwic .pg{font-size:.65rem;color:var(--faint);grid-column:1/-1}
.ctx{display:inline-flex;align-items:flex-start;--gh:22px;--k:1;--zoom:1}
.ctx .wb{width:7px;display:inline-block}
.rank{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.rank .n{width:24px;text-align:right;color:var(--faint);font-size:.7rem}
.rank .c{width:40px;text-align:right;color:var(--cyan);font-size:.78rem}
.mtx{border-collapse:collapse;font-size:.75rem;width:100%}
.mtx td,.mtx th{border:1px solid var(--line);padding:3px 5px;text-align:center}
.mtx td.z{color:var(--faint)}
.mtx td.hi{color:var(--cyan);background:rgba(56,220,195,.08)}

/* popover (memo) */
.pop{position:absolute;z-index:40;width:310px;padding:12px;background:linear-gradient(180deg,#0f2036,#0a1628);border:1px solid var(--teal);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px rgba(56,220,195,.2),0 0 24px rgba(56,220,195,.15)}
.pop .ph{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.pop .ph .gbig{--gh:46px}
.pop textarea{min-height:2.3em;font-size:.9rem}
.pop .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.pop .x{margin-left:auto}
/* sheet (mobile inspector) */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;max-height:78vh;display:flex;flex-direction:column;background:#0a1628;border-top:1px solid var(--teal);border-radius:16px 16px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sheet .grab{width:44px;height:4px;border-radius:9px;background:var(--line2);margin:7px auto 0}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(2,6,12,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mbox{width:min(760px,100%);max-height:88vh;overflow:auto;padding:18px;background:linear-gradient(180deg,#0f1f35,#091424);border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mbox h3{margin-top:0}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
/* toasts */
#toasts{position:fixed;right:14px;bottom:14px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:#0e1d31;border:1px solid var(--line2);border-left:3px solid var(--teal);padding:9px 14px;border-radius:8px;font-size:.84rem;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .25s ease-out}
.toast.err{border-left-color:var(--red)}
.toast.ok{border-left-color:var(--green)}
.toast .mini{--gh:26px}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* notes / dict / editor layout */
.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
.lst{max-height:calc(100vh - 150px);overflow:auto}
.lst .li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.lst .li:hover{background:rgba(142,238,255,.04)}
.lst .li.on{background:rgba(56,220,195,.09);box-shadow:inset 3px 0 0 var(--teal)}
.lst .li .mini{--gh:24px;flex:none}
.lst .li .t{flex:1;min-width:0;font-size:.82rem}
.lst .li .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane{padding:16px}
.hyp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#08121f}
.hyp.rej{opacity:.5}
.hyp .hm{font-size:1.05rem;color:var(--ink)}
.hyp .meta{font-size:.72rem;color:var(--faint);margin-top:4px}
.hyp .bs{font-size:.8rem;color:var(--dim);margin-top:4px;white-space:pre-wrap}
.hist{font-size:.72rem;color:var(--dim);border-left:2px solid var(--line2);margin:6px 0 0 2px;padding-left:8px}
.hist div{margin:3px 0}
.vres{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:.8rem;border:1px solid var(--line2);background:#0a1729}
.vres.exact{border-color:#2d5a3e;color:#c8f3d8}
.vres.near{border-color:#5d4b2a;color:#f6e2b7}
.vres.wrong{border-color:#5a2d33;color:#f6c5ca}
.refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dtab{width:100%;border-collapse:collapse;font-size:.82rem}
.dtab th{font-weight:500;color:var(--dim);font-size:.72rem;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.dtab td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.dtab tr:hover td{background:rgba(142,238,255,.03);cursor:pointer}
.dtab .mini{--gh:24px}
.picker{display:flex;flex-wrap:wrap;gap:4px;max-height:40vh;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:8px}
.picker .gc{padding:3px;border:1px solid var(--line);border-radius:6px;--gh:30px}
/* editor */
.src{padding:16px 14px;border:1px solid var(--line2);border-radius:10px;background:rgba(5,12,22,.6);overflow-x:auto}
.src .ew{display:inline-flex;flex-direction:column;align-items:center;margin:0 8px 10px 0;vertical-align:top}
.src .ew .w{margin-right:0;padding:2px;border-radius:6px}
.src .ew.ok .w{box-shadow:0 0 0 1.5px rgba(111,227,154,.6);background:rgba(111,227,154,.06)}
.src .ew.miss .w{box-shadow:0 0 0 1.5px rgba(240,195,107,.7);background:rgba(240,195,107,.07)}
.src .ew.act .w{box-shadow:0 0 0 1.5px var(--cyan)}
.src .wg{width:88px;font-size:.78rem;padding:4px 5px;margin-top:4px;text-align:center}
.src .wgm{font-size:.7rem;height:14px;margin-top:2px}
.src .wgm.ok{color:var(--green)}.src .wgm.ng{color:var(--red)}.src .wgm.nr{color:var(--amber)}
.res{margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--line2);background:#091526;font-size:.85rem}
.res.ok{border-color:#2d5a3e}
.res ul{margin:6px 0 0;padding-left:20px}
.meter{height:8px;background:#0f2036;border-radius:9px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--green))}
.model{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(111,227,154,.07);border:1px solid #2d5a3e}

/* settings (all in script) */
.set{max-width:780px;margin:0 auto;padding:22px}
.srow{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.srow .lab{width:110px;display:flex;justify-content:flex-start;--gh:34px}
.srow .lab .gc{cursor:pointer}
.sbtn{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:5px 9px;display:inline-flex;align-items:center;justify-content:center;min-width:52px;min-height:48px;--gh:30px}
.sbtn .gc{pointer-events:none}
.sbtn:hover{border-color:var(--teal)}
.sbtn:active{transform:translateY(1px)}
.sbtn.on{border-color:var(--teal);background:rgba(56,220,195,.14);box-shadow:0 0 14px rgba(56,220,195,.2)}
.pips{display:flex;gap:4px;align-items:flex-end;height:30px}
.pips i{width:10px;border-radius:2px;background:#13243a;border:1px solid var(--line2)}
.pips i.on{background:var(--teal);box-shadow:0 0 8px rgba(56,220,195,.6);border-color:var(--teal)}
.pips.off i.on{background:#2a4253;box-shadow:none}
.tgl{width:56px;height:30px;border-radius:99px;border:1px solid var(--line2);background:#0a1626;position:relative;padding:0}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#2c4a63;transition:.2s}
.tgl.on{background:rgba(56,220,195,.25);border-color:var(--teal)}
.tgl.on:after{left:29px;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.eq{display:flex;gap:2px;align-items:flex-end;height:22px;width:34px}
.eq i{flex:1;background:var(--teal);border-radius:1px;height:20%;opacity:.8}
.eq.play i{animation:eq 1s ease-in-out infinite}
.eq.play i:nth-child(2){animation-delay:-.3s}.eq.play i:nth-child(3){animation-delay:-.6s}.eq.play i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:20%}50%{height:var(--eqh,90%)}}
.demo{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px dashed var(--line2);border-radius:8px;color:var(--dim)}
.arrowdemo{font-size:1.2rem;letter-spacing:.4em;color:var(--teal)}
.sflash{animation:sflash .9s ease-out}
@keyframes sflash{0%{box-shadow:0 0 0 2px var(--cyan),0 0 30px var(--cyan)}100%{box-shadow:none}}
.sfoot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:20px 0 6px}
.scf{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px}

/* progress */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pgrid .panel{padding:12px}
.pgrid b{display:block;font-size:1.5rem;color:var(--cyan)}
.pgrid small{color:var(--dim)}
.big-meter{height:14px;background:#0f2036;border-radius:9px;overflow:hidden;margin:8px 0 4px}
.big-meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));box-shadow:0 0 14px var(--teal)}
.stages{list-style:none;margin:0;padding:0}
.stages li{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:.86rem}
.stages .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:.7rem;flex:none}
.stages li.done .ck{border-color:var(--green);color:var(--green);box-shadow:0 0 8px rgba(111,227,154,.4)}
.ptab{width:100%;border-collapse:collapse;font-size:.8rem}
.ptab td,.ptab th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.ptab th{color:var(--dim);font-weight:500;font-size:.72rem}

/* hints */
.hint{padding:10px 12px;border:1px solid var(--line2);border-radius:8px;margin:8px 0;background:#0a1729;font-size:.88rem}
.hint .lv{font-size:.7rem;color:var(--amber);letter-spacing:.1em}

@media (max-width:1100px){
  .reader{grid-template-columns:minmax(0,1fr)}
  .reader .insp{display:none}
  .split{grid-template-columns:minmax(0,1fr)}
  .lst{max-height:34vh}
}
@media (max-width:760px){
  :root{--gh:30px}
  main{padding:8px 8px 84px}
  #top{padding:6px 10px;backdrop-filter:none;-webkit-backdrop-filter:none;background:#050a14}
  .brand small{display:none}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:rgba(5,10,20,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
  #nav button{flex-direction:column;gap:1px;padding:6px 2px;font-size:.6rem;justify-content:center}
  #nav button i{font-size:.75rem}
  #savestat{margin-left:auto}
  .rbar{top:48px;padding:6px}
  .ticks{display:none}
  .paper{padding:18px 12px 54px}
  .pop{position:fixed;left:8px!important;right:8px;width:auto!important;bottom:72px;top:auto!important}
  .srow .lab{width:72px}
  .fig .lbl{--k:.5;padding:1px 3px}
  .mbox{padding:14px}
  .src .wg{width:70px}
  .dtab .hide-m{display:none}
}

const CONF = ['未解明', '仮説', '有力', '確定'];

function ensureEntry(key) {

}
function keyOcc(key) { const gs = gsOf(key); if (gs.length === 1) return (BYG[gs[0]] || []).map(r => ({ rec: r, len: 1 })); return findSeq(key).map(x => ({ rec: x.rec, len: gs.length })); }

function kanjiNum(s) {

    else if (ch === '十' || ch === '百' || ch === '千') { const m = ch === '十' ? 10 : ch === '百' ? 100 : 1000; sec += (cur || 1) * m; cur = 0; any = true; }

}

}

    const ns = numsIn(text);

    let dec = 0; let ok = true; gs.forEach(g => { if (DIGITV[g] > 9) ok = false; dec = dec * 10 + DIGITV[g]; });
    if (gs.length > 1 && ns.includes(dec)) return { res: 'near', msg: '各記号の読み取りは合っているようです。ただし桁の数え方（何で繰り上がるか）を見直してみてください。', refs: suggestRefs(key) };
    if (ns.length) return { res: 'wrong', msg: '値が資料と一致しません。表の列の増え方や、図に描かれた数と照らし合わせてみましょう。', refs: suggestRefs(key) };

    return { res: 'none', msg: inside ? 'この並びは単独では語として使われていないようです。並びの区切り方（どこからどこまでが1語か）を見直してください。' : 'この並びは1つの語として登録されていないようです。区切りを見直してください。', refs: suggestRefs(key) };

      const M = {

function computeProgress() {

  const unitsOk = UNITS.filter(u => state.trans[u.id] && state.trans[u.id].ok);

  const longPage = PUB.pages.some(pg => { const us = UNITS.filter(u => u.p === pg.n); return us.length >= 7 && us.every(u => state.trans[u.id] && state.trans[u.id].ok); });

    ['第2段階：数字や記号の意味を推理', digitsSolved >= 3, '数字の記号（または数の並び）を3つ以上照合で確かめる'],
    ['第3段階：基本的な単語を解読', contSolved >= 10, '内容を表す記号を10個以上照合で確かめる'],
    ['第4段階：単語の組み合わせを解読', compSolved >= 2, '複数の記号からなる語を2つ以上照合で確かめる'],
    ['第5段階：文法を推理', markSolved >= 3, '文法の働きをもつ小さな記号を3つ以上照合で確かめる'],
    ['第6段階：短い文章を翻訳', unitsOk.length >= 5, '5つ以上の文を正しく翻訳する'],

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePop(); closeModal(); closeSheet(); return; }
  if (state.view !== 'reader' || /input|textarea|select/i.test((e.target.tagName || ''))) return;
  const rev = state.settings.reverse;
  if (e.key === 'ArrowRight') goPage(state.page + (rev ? -1 : 1));
  if (e.key === 'ArrowLeft') goPage(state.page + (rev ? 1 : -1));
});
window.addEventListener('pagehide', () => { if (saveTimer) save(true); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) save(true); });
window.addEventListener('error', (e) => { console.error(e.error || e.message); toast('エラーが発生しましたが、操作は続けられます。', 'err'); });
window.addEventListener('unhandledrejection', (e) => { console.error(e.reason); });
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (state.view === 'reader') { closePop(); renderInsp(); } }, 200); });

load(); applySettings();
$$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
render();
if (!localStorage.getItem(SAVE_KEY)) save();
else { $('#savestat').textContent = '保存データを読み込みました'; }
// test hook (no answers exposed)
window.__US = { state: () => state, LINES, BYG, UNITS, gradeUnit: (l, t) => gradeUnit(l, t), verifyKey: (k, t) => verifyKey(k, t), goPage, setView };
})();
</script>
</body>
